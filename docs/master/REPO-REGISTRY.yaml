version: "1.1.0"
updated_at: "2026-10-11"
canonical_master: "gwapupward-hub/gwapspot-web/docs/master"

repositories:
  gwapspot_web:
    repo: "gwapupward-hub/gwapspot-web"
    role: "public gateway + GwapOS application/integration"
    local_authority:
      - "README.md"
      - "AGENTS.md"
      - "repo-local docs and tests"

  ppv:
    repo: "gwapupward-hub/ppv"
    role: "proof + commerce protocol"
    local_authority:
      - "README.md"
      - "docs/deployment-gates.md"
      - "docs/security-model.md"
      - "docs/threat-model.md"
      - "deployments/evidence/"
    hard_rule: "MASTER may coordinate PPV but cannot weaken PPV custody/mainnet/release gates."

  gns:
    repo: "gwapupward-hub/gwap-names"
    role: ".gwap naming and identity protocol"
    local_authority:
      - "CLAUDE.md"
      - "gwap-names/docs/protocol-spec.md"
      - "program source + generated IDLs"
    hard_rule: "Mainnet authority/audit requirements remain repo-local gates."

  gwapscore:
    repo: "gwapupward-hub/GwapScore-Official-v1"
    role: "social-reputation-first multidimensional reputation protocol"
    local_authority:
      - "GWAPSCORE_V2_FOUNDATION_FREEZE.md"
      - "GWAPSCORE_REPUTATION_MODEL_V2.md"
      - "GWAP-MASTER.md"
      - "AGENTS.md"
      - "gwap-score-full/reputation/"
      - "gwap-score-full/__tests__/"
    master_direction: "GwapScore owns social-first reputation scoring and may consume reputation-eligible Wallet Intelligence as a supporting dimension. GNS owns .gwap identity/naming/resolution. Wallet Exposure Risk and wallet wealth remain outside the reputation formula."
    hard_rule: "The v2 foundation freeze and stronger repo-local scoring/security invariants remain authoritative unless superseded by an explicit Founder decision; older wallet-only, risk, and 0-100 scoring policies do not override v2."

  gwapmojis:
    repo: "gwapupward-hub/gwapmojis"
    role: "Telegram-native collectible/gifting protocol"
    local_authority:
      - "docs/FOUNDER-SPEC-FREEZE-v1.1-FINAL.md"
      - "config/founder-locks.json"
      - "docs/FORGE-FINAL-33.md"
      - "docs/SECURITY-AND-RELEASE-GATES.md"
    hard_rule: "Founder Spec Freeze wins for repo-local behavior; Solana/Metaplex research cannot silently replace TON/Telegram locks."

integration_contract:
  master_owns:
    - "cross-system boundaries"
    - "source authority routing"
    - "shared decision status vocabulary"
    - "cross-system release evidence expectations"
  local_repos_own:
    - "implementation-specific invariants"
    - "stronger security gates"
    - "repo-specific release procedures"
    - "frozen Founder/product constants"
