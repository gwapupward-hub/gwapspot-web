<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lil Gwapz — 152 Reactions. Every Mood.</title>
  <meta name="description" content="152 Lil Gwapz reaction stickers from Reaction Pack 01: 76 male and 76 female. Get the sticker sets from the official Telegram bot." />
  <link rel="canonical" href="https://lilgwapz.xyz/" />
  <meta name="theme-color" content="#050607" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lil Gwapz — Reaction Pack 01" />
  <meta property="og:description" content="76 reactions each. 152 ways to say it." />
  <meta property="og:url" content="https://lilgwapz.xyz/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="https://www.gwapspot.com/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050607;
      --green: #13dd13;
      --ink: #ecf6ec;
      --soft: #c9d6cb;
      --muted: #8b968d;
      --line: #1d2a1e;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) clamp(18px, 4vw, 40px) 40px;
    }

    .prompt {
      margin: 0 0 clamp(32px, 6vw, 64px);
      color: var(--muted);
      font-size: 14px;
    }

    .prompt__sign { color: var(--green); }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.05em;
      margin-left: 4px;
      background: var(--green);
      vertical-align: -0.15em;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    h1 {
      margin: 0;
      font-size: clamp(56px, 13vw, 148px);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.04em;
    }

    .lede {
      max-width: 34rem;
      margin: 24px 0 0;
      font-size: clamp(16px, 2vw, 19px);
      color: var(--soft);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 20px;
      border: 2px solid var(--green);
      color: var(--green);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .btn--primary {
      background: var(--green);
      color: #021002;
    }

    .btn:hover { background: rgba(19, 221, 19, 0.12); }
    .btn--primary:hover { background: #3ff03f; }

    a:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .sheets {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: clamp(48px, 8vw, 96px);
    }

    .sheets figure {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
    }

    .sheets img {
      display: block;
      width: 100%;
      height: auto;
    }

    .sheets figcaption {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .foot {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .foot a { color: var(--green); }

    @media (max-width: 640px) {
      .sheets { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="prompt" aria-hidden="true"><span class="prompt__sign">$</span> lil-gwapz --pack 01<span class="cursor"></span></p>

    <header>
      <h1>Lil Gwapz</h1>
      <p class="lede">152 reaction stickers from Reaction Pack 01. 76 male, 76 female. Browse them, download them, and share the ones that fit.</p>
      <div class="actions">
        <a class="btn btn--primary" href="https://t.me/ThaLilGwapz_bot" target="_blank" rel="noopener noreferrer">Open the Telegram bot</a>
        <a class="btn" href="https://www.gwapspot.com/lil-gwapz" target="_blank" rel="noopener noreferrer">Browse all 152 on GwapSpot</a>
      </div>
    </header>

    <section class="sheets" aria-label="Reaction sheets">
      <figure>
        <img src="https://res.cloudinary.com/dg1u1wpdu/image/upload/v1791405790/lil-gwapz/reaction-pack-01/atlas/male-a.webp" alt="Male Lil Gwapz reaction stickers, part A" width="1536" height="960" loading="eager" decoding="async" />
        <figcaption>Male reactions, part A</figcaption>
      </figure>
      <figure>
        <img src="https://res.cloudinary.com/dg1u1wpdu/image/upload/v1791405800/lil-gwapz/reaction-pack-01/atlas/male-b.webp" alt="Male Lil Gwapz reaction stickers, part B" width="1536" height="960" loading="lazy" decoding="async" />
        <figcaption>Male reactions, part B</figcaption>
      </figure>
      <figure>
        <img src="https://res.cloudinary.com/dg1u1wpdu/image/upload/v1791405811/lil-gwapz/reaction-pack-01/atlas/female-a.webp" alt="Female Lil Gwapz reaction stickers, part A" width="1536" height="960" loading="lazy" decoding="async" />
        <figcaption>Female reactions, part A</figcaption>
      </figure>
      <figure>
        <img src="https://res.cloudinary.com/dg1u1wpdu/image/upload/v1791405820/lil-gwapz/reaction-pack-01/atlas/female-b.webp" alt="Female Lil Gwapz reaction stickers, part B" width="1536" height="960" loading="lazy" decoding="async" />
        <figcaption>Female reactions, part B</figcaption>
      </figure>
    </section>

    <footer class="foot">
      <p>Lil Gwapz is part of the GWAP ecosystem. <a href="https://www.gwapspot.com" target="_blank" rel="noopener noreferrer">gwapspot.com</a></p>
    </footer>
  </main>
</body>
</html>
