<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWAP Messenger — GNS-bound OpenMLS Test Device</title></head>
<body>
<h1>GWAP Messenger: Independent Browser Test Client</h1>
<p>Isolated fixture only. No wallet, real .gwap, production account or server.</p>
<script type="module">
try {
  const m=await import('../pkg/gwap_messenger_openmls_poc.js');
  await m.default();
  const enc=new TextEncoder();
  const array=u=>Array.from(u);
  const b64=u=>btoa(Array.from(u,b=>String.fromCharCode(b)).join(''));
  const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  let pair,name,walletPair,binding,boundKeyPackage;
  const token=()=>crypto.randomUUID().replaceAll('-','');
  const hex=bytes=>Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  const digest=async bytes=>hex(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)));
  const DEVNET_GENESIS='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG';
  const GNS_PROGRAM='A9SCN6tgaoAEorFzY5ZPinruk8LCttmrAEU9JoAmUKUH';
  function nameFromIdentity(){if(!name)throw Error('Not bootstrapped');return name;}
  async function signedOperation(fields,kind){
    if(!binding)throw Error('Device binding not established');
    const wire=kind==='send'?
      ['GWAP_TWO_BROWSER_RELAY_V1','send',fields.sender,fields.recipient,
       fields.kind,fields.wireBase64,fields.nonce]:
      ['GWAP_TWO_BROWSER_RELAY_V1','pull',fields.requester,fields.afterSeq,fields.nonce];
    const action={
      network:'devnet',name:binding.name,
      accountId:binding.accountId,deviceId:binding.deviceId,
      wallet:binding.wallet,bindingGeneration:binding.bindingGeneration,
      kind,payloadHash:await digest(enc.encode(JSON.stringify(wire))),nonce:token()
    };
    const canonical=[
      'GWAP_MESSENGER_GNS_DEVICE_ACTION_V1',action.network,action.name,
      action.accountId,action.deviceId,action.wallet,action.bindingGeneration,
      action.kind,action.payloadHash,action.nonce
    ];
    return {...action,signature:b64(new Uint8Array(await crypto.subtle.sign(
      'Ed25519',pair.privateKey,enc.encode(JSON.stringify(canonical)))))};
  }
  async function signIntent(fields,kind) {
    const canonical=kind==='send'?
      ['GWAP_TWO_BROWSER_RELAY_V1','send',fields.sender,fields.recipient,
       fields.kind,fields.wireBase64,fields.nonce]:
      ['GWAP_TWO_BROWSER_RELAY_V1','pull',fields.requester,fields.afterSeq,
       fields.nonce];
    return b64(new Uint8Array(await crypto.subtle.sign('Ed25519',pair.privateKey,
      enc.encode(JSON.stringify(canonical)))));
  }
  async function request(route,body) {
    const r=await fetch(route,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify(body)});
    const result=await r.json();
    if(!r.ok)throw Error(result.error||'Test relay rejected request');
    return result;
  }
  window.__independent={
    async bootstrap(id){
      if(!['alice','bob'].includes(id))throw Error('Unexpected fixture identity');
      name=id;
      m.separate_bootstrap(id+'.gwap:fixture-device');
      pair=await crypto.subtle.generateKey('Ed25519',false,['sign','verify']);
      walletPair=await crypto.subtle.generateKey('Ed25519',false,['sign','verify']);
      const publicDer=await crypto.subtle.exportKey('spki',pair.publicKey);
      const walletRaw=await crypto.subtle.exportKey('raw',walletPair.publicKey);
      return {transportPublicSpkiBase64:b64(new Uint8Array(publicDer)),
        walletPublicRawBase64:b64(new Uint8Array(walletRaw))};
    },
    async enroll({wallet,accountId,deviceId}){
      if(binding)throw Error('Already enrolled');
      boundKeyPackage=m.separate_keypackage();
      const name=nameFromIdentity();
      const challenge=await request('/gns/challenge',{name});
      const intent={
        network:'devnet',genesisHash:DEVNET_GENESIS,programId:GNS_PROGRAM,
        name,wallet,accountId,deviceId,
        transportPublicSpkiBase64:b64(new Uint8Array(
          await crypto.subtle.exportKey('spki',pair.publicKey))),
        mlsKeyPackageHash:await digest(boundKeyPackage),
        nonce:challenge.nonce,expiresAt:challenge.expiresAt
      };
      const signature=b64(new Uint8Array(await crypto.subtle.sign('Ed25519',
        walletPair.privateKey,enc.encode(JSON.stringify([
          'GWAP_MESSENGER_GNS_DEVICE_ENROLL_V1',
          intent.network,intent.genesisHash,intent.programId,
          intent.name,intent.wallet,intent.accountId,intent.deviceId,
          intent.transportPublicSpkiBase64,intent.mlsKeyPackageHash,
          intent.nonce,intent.expiresAt
        ])))));
      binding=await request('/gns/enroll',{...intent,walletSignature:signature,
        keyPackageBase64:b64(boundKeyPackage)});
      return binding;
    },
    keypackage(){if(!boundKeyPackage)throw Error('Bind the MLS device first');
      return array(boundKeyPackage);},
    binding(){return binding?{...binding}:null;},
    invite(kp){const v=m.separate_invite(Uint8Array.from(kp));
      return {commit:array(v.commit),welcome:array(v.welcome)};},
    join(welcome){m.separate_join(Uint8Array.from(welcome));return true;},
    encrypt(text){return array(m.separate_encrypt(text));},
    receive(wire){return m.separate_receive(Uint8Array.from(wire));},
    stageCommit(){return array(m.separate_stage_update());},
    finishCommit(){m.separate_finish_update();return true;},
    authenticator(){return array(m.separate_epoch_authenticator());},
    members(){return m.separate_members_count();},
    async send(to,kind,wire) {
      const requestBody={sender:name,recipient:to,kind,
        wireBase64:b64(Uint8Array.from(wire)),nonce:token()};
      return request('/relay/send',{...requestBody,
        signature:await signIntent(requestBody,'send'),
        authorization:await signedOperation(requestBody,'send')});
    },
    async pull(afterSeq=0) {
      const requestBody={requester:name,afterSeq,nonce:token()};
      const result=await request('/relay/pull',{...requestBody,
        signature:await signIntent(requestBody,'pull'),
        authorization:await signedOperation(requestBody,'pull')});
      return {events:result.events.map(e=>({...e,wire:array(bytes(e.wireBase64))}))};
    },
    async sendAsImposter(to,kind,wire) {
      const requestBody={sender:name==='bob'?'alice':'bob',recipient:to,kind,
        wireBase64:b64(Uint8Array.from(wire)),nonce:token()};
      return request('/relay/send',{...requestBody,
        signature:await signIntent(requestBody,'send'),
        authorization:await signedOperation(requestBody,'send')});
    },
    async unauthorizedPull(forgedRequestId,afterSeq=0){
      const requestBody={requester:forgedRequestId,afterSeq,nonce:token()};
      return request('/relay/pull',{...requestBody,
        signature:await signIntent(requestBody,'pull'),
        authorization:await signedOperation(requestBody,'pull')});
    },
    publicKeyExtractable(){return pair.privateKey.extractable;},
  };
  window.__independentReady=true;
}catch(error){
  window.__independentError=String(error?.stack||error);
  window.__independentReady=false;
}
</script>
</body></html>
