[package]
name = "gwap-messenger-openmls-poc"
version = "0.1.0"
edition = "2021"
publish = false

[features]
browser-tests = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2" }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"

# Test-only POC. Cryptographic behavior is entirely provided by OpenMLS.
# Real Solana/GNS credentials and server persistence are outside this gate.
