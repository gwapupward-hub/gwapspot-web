[package]
name = "gwap-messenger-openmls-poc"
version = "0.1.0"
edition = "2021"
publish = false

[features]
browser-tests = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2" }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
# getrandom 0.2 does not enable JavaScript entropy automatically on wasm32.
# Browser/Node use platform crypto.getRandomValues, not an insecure fallback.
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Test-only POC. Cryptographic behavior is entirely provided by OpenMLS.
# Real Solana/GNS credentials and server persistence are outside this gate.
