name: Patch PPV agreement canonical scalars

on:
  push:
    branches:
      - fix/ppv-agreement-canonical-scalars

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ppv-agreement-canonical-scalars
          fetch-depth: 0

      - name: Normalize Agreement Workspace canonical scalars
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/app/ppv/agreements/agreement-workspace.tsx")
          text = path.read_text()

          replacements = [
              ('  schemaVersion: 1;\n  type: "ppv-commerce-agreement";', '  schemaVersion: "1";\n  type: "ppv-commerce-agreement";'),
              ('  schemaVersion: 1;\n  payment: {', '  schemaVersion: "1";\n  payment: {'),
              ('  dueDate: string | null;', '  dueDate: string;'),
              ('  revisionsAllowed: number;', '  revisionsAllowed: string;'),
              ('    schemaVersion: 1,\n    type: "ppv-commerce-agreement",', '    schemaVersion: "1",\n    type: "ppv-commerce-agreement",'),
              ('    schemaVersion: 1,\n    payment: {', '    schemaVersion: "1",\n    payment: {'),
              ('    dueDate: form.dueDate || null,', '    dueDate: form.dueDate,'),
              ('        ? parsedRevisions\n        : 0,', '        ? String(parsedRevisions)\n        : "0",'),
              ('    revisionsAllowed:\n      typeof terms?.revisionsAllowed === "number"\n        ? String(terms.revisionsAllowed)\n        : "0",', '    revisionsAllowed:\n      typeof terms?.revisionsAllowed === "string"\n        ? terms.revisionsAllowed\n        : typeof terms?.revisionsAllowed === "number"\n          ? String(terms.revisionsAllowed)\n          : "0",'),
          ]

          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f"Expected source fragment not found:\n{before}")
              text = text.replace(before, after, 1)

          path.write_text(text)

      - name: Add regression coverage
        shell: bash
        run: |
          cat > app/lib/ppv/agreement-canonical-scalars.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const workspace = readFileSync(
            new URL("../../app/ppv/agreements/agreement-workspace.tsx", import.meta.url),
            "utf8",
          );
          const canonical = readFileSync(
            new URL("../../lib/ppv-sdk/canonical.ts", import.meta.url),
            "utf8",
          );

          test("Agreement Workspace emits only PPV v1 canonical scalar types", () => {
            assert.match(canonical, /CanonicalScalar = string \| boolean/);
            assert.match(workspace, /schemaVersion: "1"/);
            assert.doesNotMatch(workspace, /schemaVersion:\s*1[,;]/);
            assert.match(workspace, /dueDate: form\.dueDate,/);
            assert.doesNotMatch(workspace, /dueDate: form\.dueDate \|\| null/);
            assert.match(workspace, /\? String\(parsedRevisions\)/);
            assert.match(workspace, /: "0",/);
          });
          EOF

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/patch-ppv-agreement-canonical-scalars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app/ppv/agreements/agreement-workspace.tsx app/lib/ppv/agreement-canonical-scalars.test.mjs .github/workflows/patch-ppv-agreement-canonical-scalars.yml
          git commit -m "fix(ppv): emit canonical scalar agreement documents"
          git push origin HEAD:fix/ppv-agreement-canonical-scalars
