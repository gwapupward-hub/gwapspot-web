name: GWAP Messenger archive comparison tests
on:
  push:
    branches:
      - 'test/gwap-messenger-archive-wallet-hardening-20261117'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix openmls-poc/gns-binding --no-save --ignore-scripts --no-audit --no-fund @solana/web3.js@1.98.4
      - run: node --test openmls-poc/gns-binding/roadmap-archive-comparison.test.mjs
