name: PPV Commerce Localnet Acceptance

on:
  workflow_dispatch:
  push:
    branches: ["ci/ppv-commerce-localnet-run"]

permissions:
  contents: read

concurrency:
  group: ppv-commerce-localnet
  cancel-in-progress: false

jobs:
  commerce-localnet:
    name: Commerce localnet acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout GwapSpot
        uses: actions/checkout@v4

      - name: Checkout pinned PPV package
        uses: actions/checkout@v4
        with:
          repository: gwapupward-hub/ppv
          ref: 7c4ea67a9b6d69ab85a20f497eb0c2a31b48cfd2
          path: ppv-foundation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache/restore@v4
        id: anchor-cache
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup toolchain install 1.79.0 --profile minimal
          rustup toolchain install nightly-2024-06-15 --profile minimal

      - name: Install Solana CLI 1.18.17
        run: |
          solana_bin="${HOME}/.local/share/solana/install/active_release/bin"
          if [[ ! -x "${solana_bin}/solana" ]]; then
            sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          fi
          echo "${solana_bin}" >> "${GITHUB_PATH}"
          "${solana_bin}/solana" --version

      - name: Install Anchor CLI 0.30.1
        run: |
          if [[ ! -x "${HOME}/.cargo/bin/anchor" ]] ||              [[ "$("${HOME}/.cargo/bin/anchor" --version)" != "anchor-cli 0.30.1" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libudev-dev pkg-config
            cargo +1.79.0 install               --git https://github.com/solana-foundation/anchor               --tag v0.30.1               anchor-cli               --locked               --force
          fi
          "${HOME}/.cargo/bin/anchor" --version

      - uses: actions/cache/save@v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3

      - name: Install GwapSpot dependencies
        run: npm ci

      - name: Install PPV dependencies
        working-directory: ppv-foundation
        run: npm ci

      - name: Build PPV fixtures and run GwapSpot Commerce acceptance
        shell: bash
        run: |
          set -euo pipefail

          repo_root="${GITHUB_WORKSPACE}"
          ppv_root="${GITHUB_WORKSPACE}/ppv-foundation"
          workdir="$(mktemp -d)"
          validator_pid=""

          cleanup() {
            status=$?
            if [[ -n "${validator_pid}" ]]; then
              kill "${validator_pid}" 2>/dev/null || true
              wait "${validator_pid}" 2>/dev/null || true
            fi
            rm -rf "${workdir}"
            exit "${status}"
          }
          trap cleanup EXIT

          cd "${ppv_root}"

          provider_wallet="${HOME}/.config/solana/id.json"
          if [[ ! -f "${provider_wallet}" ]]; then
            mkdir -p "$(dirname "${provider_wallet}")"
            solana-keygen new --silent --no-bip39-passphrase --outfile "${provider_wallet}"
          fi

          ./scripts/prepare-ephemeral-program-ids.sh
          export RUSTUP_TOOLCHAIN=nightly-2024-06-15
          anchor build

          core_id="$(solana-keygen pubkey target/deploy/ppv_core-keypair.json)"
          commerce_id="$(solana-keygen pubkey target/deploy/ppv_commerce-keypair.json)"

          solana-test-validator             --reset             --quiet             --ledger "${workdir}/test-ledger" &
          validator_pid=$!

          for _ in $(seq 1 60); do
            if solana --url http://127.0.0.1:8899 cluster-version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          solana --url http://127.0.0.1:8899 cluster-version >/dev/null

          solana --url http://127.0.0.1:8899 airdrop 100             "$(solana-keygen pubkey "${provider_wallet}")" >/dev/null

          anchor test --skip-build --skip-local-validator

          cd "${repo_root}"
          PPV_LOCALNET_RPC_URL=http://127.0.0.1:8899           PPV_LOCALNET_CORE_PROGRAM_ID="${core_id}"           PPV_LOCALNET_COMMERCE_PROGRAM_ID="${commerce_id}"           PPV_LOCALNET_REPORT_PATH="${repo_root}/artifacts/ppv-commerce-localnet-report.json"             npm run test:ppv:commerce:localnet

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppv-commerce-localnet-evidence
          path: artifacts/ppv-commerce-localnet-report.json
          if-no-files-found: error
