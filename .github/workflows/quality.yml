name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ppv-integration:
    # The PPV client against the real PPV programs on a local validator. It is a
    # long job, so it is filtered to changes that can actually break that seam
    # rather than run on every pull request. `validate` stays unfiltered.
    name: PPV integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the PPV seam changed
        id: scope
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          # A new branch or a force push leaves no usable base. Run rather than
          # silently skip: a skipped required check is indistinguishable from a
          # passing one.
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${base}" HEAD | grep -Eq '^(app/app/lib/ppv/|app/lib/ppv/|app/app/vault/|\.github/workflows/quality\.yml$)'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "No PPV changes in this diff; skipping the local-validator run."
          fi

      - name: Require a working protocol checkout token
        if: steps.scope.outputs.run == 'true'
        env:
          PPV_PROTOCOL_TOKEN: ${{ secrets.PPV_PROTOCOL_TOKEN }}
        run: |
          # actions/checkout retries an anonymous fetch three times and fails
          # with "could not read Username", which names neither the secret nor
          # the repository, and reads identically whether the token is missing,
          # expired, or simply not scoped to gwapupward-hub/ppv. Ask the API
          # first so the failure says which of those it is.
          hint='Add it at Settings > Secrets and variables > Actions. Mint it at https://github.com/settings/personal-access-tokens/new with resource owner gwapupward-hub, repository access limited to gwapupward-hub/ppv, and Contents: Read-only. See docs/PPV_DEVNET.md.'
          if [[ -z "${PPV_PROTOCOL_TOKEN}" ]]; then
            echo "::error::PPV_PROTOCOL_TOKEN is not set. This job checks out the private gwapupward-hub/ppv, which GITHUB_TOKEN cannot reach. ${hint}"
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${PPV_PROTOCOL_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/gwapupward-hub/ppv)"
          case "${status}" in
            200) echo "PPV_PROTOCOL_TOKEN can read gwapupward-hub/ppv." ;;
            401) echo "::error::PPV_PROTOCOL_TOKEN was rejected (401). It is invalid or expired. ${hint}"; exit 1 ;;
            404) echo "::error::PPV_PROTOCOL_TOKEN is valid but cannot see gwapupward-hub/ppv (404). The repository is private, so this means it is not in the token's selected repositories. ${hint}"; exit 1 ;;
            *)   echo "::error::Could not verify PPV_PROTOCOL_TOKEN against the GitHub API (HTTP ${status}). ${hint}"; exit 1 ;;
          esac

      - name: Check out the PPV protocol
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: gwapupward-hub/ppv
          ref: main
          path: ppv
          # A read-only contents token for gwapupward-hub/ppv. GITHUB_TOKEN is
          # scoped to this repository and cannot reach another one.
          token: ${{ secrets.PPV_PROTOCOL_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache/restore@v4
        if: steps.scope.outputs.run == 'true'
        id: anchor-cache
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3

      - name: Install pinned Rust toolchains
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          # Anchor 0.30.1's locked `time` dependency predates Rust 1.80, so the
          # CLI itself is built with 1.79.0.
          rustup toolchain install 1.79.0 --profile minimal
          # Anchor builds the IDL with `cargo +nightly`, and anchor-syn calls
          # proc_macro2::Span::source_file() — an unstable API later nightlies
          # removed. Pinning it makes the build fail on code, never on a date.
          rustup toolchain install nightly-2024-06-15 --profile minimal

      - name: Install Solana CLI 1.18.17
        if: steps.scope.outputs.run == 'true'
        run: |
          solana_bin="${HOME}/.local/share/solana/install/active_release/bin"
          if [[ ! -x "${solana_bin}/solana" ]]; then
            sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          fi
          echo "${solana_bin}" >> "${GITHUB_PATH}"
          "${solana_bin}/solana" --version

      - name: Install Anchor CLI 0.30.1
        if: steps.scope.outputs.run == 'true'
        run: |
          if [[ ! -x "${HOME}/.cargo/bin/anchor" ]] || \
             [[ "$("${HOME}/.cargo/bin/anchor" --version)" != "anchor-cli 0.30.1" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libudev-dev pkg-config
            cargo +1.79.0 install \
              --git https://github.com/solana-foundation/anchor \
              --tag v0.30.1 anchor-cli --locked --force
          fi
          "${HOME}/.cargo/bin/anchor" --version

      - uses: actions/cache/save@v4
        if: steps.scope.outputs.run == 'true' && steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Run the PPV integration harness
        if: steps.scope.outputs.run == 'true'
        env:
          PPV_PROTOCOL_DIR: ${{ github.workspace }}/ppv
        run: node --experimental-strip-types --test app/app/lib/ppv/integration.test.mjs
