name: GWAP Messenger — PostgreSQL envelope-granted delivery gate

on:
  push:
    branches:
      - 'test/gwap-messenger-postgres-envelope-ds-20261117'
    paths:
      - 'openmls-poc/checkpoint/**'
      - '.github/workflows/gwap-messenger-envelope-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gwap-messenger-envelope-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  envelope-postgres:
    name: Signed checkpoint, per-envelope grant, recipient ACL and PostgreSQL crash-safety reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gwap_checkpoint_test
          POSTGRES_USER: gwap_test
          POSTGRES_PASSWORD: gwap_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwap_test -d gwap_checkpoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECKPOINT_TEST_DATABASE_URL: postgres://gwap_test:gwap_test_password@127.0.0.1:5432/gwap_checkpoint_test
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Configure Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source syntax checks
        run: |
          node --version
          node --check openmls-poc/checkpoint/durable-checkpoint.mjs
          node --check openmls-poc/checkpoint/pg-envelope-ds.mjs
          node --check openmls-poc/checkpoint/pg-envelope-ds.test.mjs
      - name: Install test-only PostgreSQL client
        run: npm install --prefix openmls-poc/checkpoint --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Regress 14 PostgreSQL checkpoint tests
        run: node --test openmls-poc/checkpoint/durable-checkpoint.test.mjs
      - name: Regress signed localhost HTTP contract
        run: node --test openmls-poc/checkpoint/local-http-test-server.test.mjs
      - name: Run per-envelope transactional grants and signed recipient access
        run: node --test openmls-poc/checkpoint/pg-envelope-ds.test.mjs

# Ephemeral GitHub Actions PostgreSQL only; NO Neon/live database, user data,
# GNS integration, deploy, branch merge or production approval.
