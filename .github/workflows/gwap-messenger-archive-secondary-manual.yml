name: GWAP Messenger manual archive corroboration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GNS_ARCHIVE_READONLY_DEVNET_RPC: ${{ secrets.GNS_ARCHIVE_READONLY_DEVNET_RPC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require securely configured independent archive RPC
        run: |
          if [ -z "$GNS_ARCHIVE_READONLY_DEVNET_RPC" ]; then
            echo "Independent archive devnet RPC not configured. Gate remains blocked."
            exit 2
          fi
      - name: Install read-only Solana client
        run: npm install --prefix openmls-poc/gns-binding --no-save --ignore-scripts --no-audit --no-fund @solana/web3.js@1.98.4
      - name: Compare finalized roadmap.gwap ownership and full history
        run: node openmls-poc/gns-binding/roadmap-independent-archive-audit.mjs

# Explicit manual trigger only, no user or production wallet signing.
# Never print the RPC URL or connection errors containing its token.
# This isolated workflow must not be merged or deployed without owner approval.
