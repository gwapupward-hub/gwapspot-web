version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 8
    groups:
      react-stack:
        applies-to: "version-updates"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      next-stack:
        applies-to: "version-updates"
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      routine-dependencies:
        applies-to: "version-updates"
        patterns:
          - "@upstash/redis"
          - "@vercel/analytics"
          - "@vercel/speed-insights"
          - "redis"
          - "bs58"
          - "buffer"
          - "tweetnacl"
          - "@tailwindcss/postcss"
          - "tailwindcss"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=23"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
